name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Bez těchto proměnných build projde, ale aplikace na webu zobrazí
      # "Chybí připojení k Supabase". Radši selžeme hned tady.
      - name: Zkontrolovat konfiguraci
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_AUTH_EMAIL: ${{ vars.VITE_AUTH_EMAIL }}
        run: |
          test -n "$VITE_SUPABASE_URL" || { echo "::error::Chybí repository variable VITE_SUPABASE_URL"; exit 1; }
          test -n "$VITE_SUPABASE_ANON_KEY" || { echo "::error::Chybí repository variable VITE_SUPABASE_ANON_KEY"; exit 1; }
          test -n "$VITE_AUTH_EMAIL" || { echo "::error::Chybí repository variable VITE_AUTH_EMAIL"; exit 1; }

      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_AUTH_EMAIL: ${{ vars.VITE_AUTH_EMAIL }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
